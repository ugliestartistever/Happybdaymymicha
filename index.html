!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background-color: #510000;
            min-height: 100vh;
            overflow-y: auto !important;
        }
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        img { 
            width: 100%; 
            max-width: 450px; 
            height: auto; 
            display: block; 
        }
        .interaction-box {
            width: 100%;
            max-width: 280px;
            background: rgba(171, 0, 0, 0.7019607843137254);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(102, 0, 168, 0.4);
            margin: 30px 0 60px 0;
        }
        .question {
            color: #ffffff;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .btn-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr;
            gap: 8px; 
        }
        a { 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.9rem;
            border-radius: 10px;
            transition: transform 0.1s ease;
        }
        .yes { background: #e10000; color: #5b0097; }
        .no { background: rgb(125, 0, 237); color: #9c0000; }
        a:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <img src="https://i.imgur.com/6gIXaY8.jpeg">

    <div class="interaction-box">
        <div class="question">do you like it?</div>
        <div class="btn-group">
            <a href="https://i.imgur.com/MNMZoXQ.png" target="_blank" class="yes">yes 👀</a>
            <a href="https://i.imgur.com/LofkpJA.png" class="no">no.</a>
        </div>
    </div>

</body>
  </html>
